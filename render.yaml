version: 0.1
services:
  # Backend API Service
  - type: web
    name: attendance-system-backend
    env: node
    region: ohio
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true
    
    # Build Command
    buildCommand: |
      npm install
    
    # Start Command
    startCommand: npm start
    
    # Environment Variables
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        value: "*"  # Change this to your specific frontend URL in production
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

jobs:
  # Clean up expired QR codes daily
  - type: cron
    name: cleanup-expired-qr
    env: node
    region: ohio
    plan: free
    schedule: "0 0 * * *"
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node scripts/cleanup.js
